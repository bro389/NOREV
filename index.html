
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOREV | Perfume Store</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:#f5f0e6;font-family:Arial,sans-serif}
header{padding:22px 6%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #383020;position:sticky;top:0;background:#090909;z-index:5}
.logo{font-size:30px;letter-spacing:7px;color:#d8b66a;font-weight:bold}
nav button,.btn{background:none;border:1px solid #b99a55;color:#e8d5a5;padding:10px 14px;border-radius:5px;cursor:pointer;margin:3px}
.hero{text-align:center;padding:65px 15px;background:linear-gradient(120deg,#17130c,#090909)}
.hero h1{font-size:42px;color:#d8b66a;letter-spacing:5px;margin:0 0 12px}
.hero p{color:#c7bda9}
main{padding:28px 6%}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}
input,select{background:#171717;color:white;border:1px solid #66552f;padding:12px;border-radius:5px}
#search{flex:1;min-width:180px}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px}
.card{background:#141414;border:1px solid #332b1b;border-radius:9px;padding:14px;position:relative}
.bottle{height:190px;border-radius:7px;background:radial-gradient(circle at 50% 35%,#343434,#111 65%);display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.bottle span{display:block;width:76px;height:125px;border:2px solid #b99a55;border-radius:12px 12px 8px 8px;background:linear-gradient(90deg,#111,#333,#111);box-shadow:0 8px 22px #000;position:relative}
.bottle span:before{content:"";position:absolute;width:30px;height:17px;background:#b99a55;top:-19px;left:21px;border-radius:4px}
.bottle span:after{content:"NOREV";position:absolute;top:48px;left:0;right:0;text-align:center;color:#e3c77d;font-size:9px;letter-spacing:2px}
.card h3{margin:8px 0;color:#e6d4a9}
.price{color:#d8b66a;font-weight:bold;font-size:18px}
.card button{cursor:pointer}
.heart{position:absolute;right:12px;top:12px;background:#222;border:1px solid #806a3a;color:white;border-radius:50%;width:36px;height:36px;font-size:18px}
.add{background:#b99a55;color:#111;border:0;padding:11px;border-radius:5px;width:100%;font-weight:bold;margin-top:10px}
.panel{background:#141414;border:1px solid #66552f;padding:20px;border-radius:8px;margin:20px 0}
.hidden{display:none}
footer{text-align:center;padding:30px;color:#887d69;border-top:1px solid #332b1b;margin-top:45px}
</style>
</head>
<body>
<header>
 <div class="logo">NOREV</div>
 <nav>
  <button onclick="showShop()">Sklep</button>
  <button onclick="showFav()">❤️ Ulubione <span id="favCount">0</span></button>
  <button onclick="showCart()">🛒 Koszyk <span id="cartCount">0</span></button>
  <button onclick="login()">Konto</button>
 </nav>
</header>

<section class="hero">
 <h1>NOREV</h1>
 <p>Zapach, który zostaje w pamięci.</p>
 <button class="btn" onclick="showShop()">ODKRYJ KOLEKCJĘ</button>
</section>

<main>
 <section id="shop">
  <div class="tools">
   <input id="search" placeholder="Szukaj perfum..." oninput="render()">
   <select id="filter" onchange="render()">
    <option value="all">Wszystkie perfumy</option>
    <option value="men">Męskie</option>
    <option value="women">Damskie</option>
   </select>
  </div>
  <div class="products" id="products"></div>
 </section>

 <section id="favorites" class="hidden">
  <h2>❤️ Ulubione</h2>
  <div class="products" id="favProducts"></div>
 </section>

 <section id="cart" class="hidden">
  <h2>🛒 Twój koszyk</h2>
  <div id="cartItems"></div>
  <h3 id="total"></h3>
  <button class="add" onclick="checkout()">Przejdź dalej (DEMO)</button>
 </section>
</main>

<footer>NOREV © 2026 | Wersja demonstracyjna</footer>

<script>
const perfumes=[
 {id:1,name:"Versace Eros",price:299,sex:"men",color:"#075b9b"},
 {id:2,name:"Dior Sauvage",price:389,sex:"men",color:"#202b42"},
 {id:3,name:"Yves Saint Laurent Y",price:349,sex:"men",color:"#162c38"},
 {id:4,name:"Armani Stronger With You",price:369,sex:"men",color:"#75452b"},
 {id:5,name:"Bleu de Chanel",price:459,sex:"men",color:"#142b48"},
 {id:6,name:"Paco Rabanne 1 Million",price:329,sex:"men",color:"#a77b19"},
 {id:7,name:"Jean Paul Gaultier Le Male",price:379,sex:"men",color:"#176a75"},
 {id:8,name:"Carolina Herrera Good Girl",price:399,sex:"women",color:"#151515"},
 {id:9,name:"Lancôme La Vie Est Belle",price:359,sex:"women",color:"#9b6c8b"},
 {id:10,name:"Baccarat Rouge 540",price:699,sex:"unisex",color:"#842d2d"}
];

let cart=JSON.parse(localStorage.getItem("norevCart")||"[]");
let fav=JSON.parse(localStorage.getItem("norevFav")||"[]");

function save(){
 localStorage.setItem("norevCart",JSON.stringify(cart));
 localStorage.setItem("norevFav",JSON.stringify(fav));
 document.getElementById("cartCount").textContent=cart.reduce((a,b)=>a+b.qty,0);
 document.getElementById("favCount").textContent=fav.length;
}
function card(p){
 return `<article class="card">
 <button class="heart" onclick="toggleFav(${p.id})">${fav.includes(p.id)?"❤️":"♡"}</button>
 <div class="bottle"><span style="background:linear-gradient(90deg,#111,${p.color},#111)"></span></div>
 <h3>${p.name}</h3><p class="price">${p.price} zł</p>
 <button class="add" onclick="addCart(${p.id})">DODAJ DO KOSZYKA</button>
 </article>`;
}
function render(){
 let q=document.getElementById("search").value.toLowerCase();
 let f=document.getElementById("filter").value;
 let list=perfumes.filter(p=>p.name.toLowerCase().includes(q)&&(f==="all"||p.sex===f||p.sex==="unisex"));
 document.getElementById("products").innerHTML=list.map(card).join("");
}
function toggleFav(id){
 fav=fav.includes(id)?fav.filter(x=>x!==id):[...fav,id];
 save();render();renderFav();
}
function renderFav(){
 let list=perfumes.filter(p=>fav.includes(p.id));
 document.getElementById("favProducts").innerHTML=list.length?list.map(card).join(""):"Nie masz jeszcze ulubionych produktów.";
}
function addCart(id){
 let item=cart.find(x=>x.id===id);
 if(item)item.qty++;else cart.push({id,qty:1});
 save();alert("Dodano do koszyka!");
}
function showOnly(id){
 ["shop","favorites","cart"].forEach(x=>document.getElementById(x).classList.add("hidden"));
 document.getElementById(id).classList.remove("hidden");
}
function showShop(){showOnly("shop")}
function showFav(){renderFav();showOnly("favorites")}
function showCart(){
 showOnly("cart");
 let box=document.getElementById("cartItems");
 if(!cart.length){box.innerHTML="Koszyk jest pusty.";document.getElementById("total").textContent="";return}
 box.innerHTML=cart.map(x=>{
  let p=perfumes.find(y=>y.id===x.id);
  return `<div class="panel"><b>${p.name}</b> — ${p.price} zł
  <p>Ilość: <button onclick="changeQty(${p.id},-1)">−</button> ${x.qty}
  <button onclick="changeQty(${p.id},1)">+</button>
  <button onclick="removeItem(${p.id})">Usuń</button></p></div>`;
 }).join("");
 let sum=cart.reduce((a,x)=>a+perfumes.find(p=>p.id===x.id).price*x.qty,0);
 document.getElementById("total").textContent="Razem: "+sum+" zł";
}
function changeQty(id,n){
 let x=cart.find(p=>p.id===id);x.qty+=n;
 if(x.qty<=0)cart=cart.filter(p=>p.id!==id);
 save();showCart();
}
function removeItem(id){cart=cart.filter(x=>x.id!==id);save();showCart()}
function checkout(){
 alert("To tylko wersja DEMO. Zamówienia i płatności nie są prawdziwe.");
}
function login(){
 let name=prompt("Wpisz nazwę użytkownika (konto demo):");
 if(name)alert("Witaj, "+name+"! To tylko konto demonstracyjne.");
}
save();render();
</script>
</body>
</html>
